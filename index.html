<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giovanni Nicolazzo | Research portfolio</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://colazeta.github.io/en/">
  <link rel="alternate" hreflang="en" href="https://colazeta.github.io/en/">
  <link rel="alternate" hreflang="it" href="https://colazeta.github.io/it/">
  <link rel="alternate" hreflang="de" href="https://colazeta.github.io/de/">
  <link rel="alternate" hreflang="x-default" href="https://colazeta.github.io/en/">
  <script>
    (() => {
      const supported = ['en', 'it', 'de'];
      const saved = localStorage.getItem('preferredLang');
      const browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
      const language = supported.includes(saved) ? saved : (supported.includes(browser) ? browser : 'en');
      window.location.replace(`/${language}/`);
    })();
  </script>
</head>
<body>
  <main>
    <p>Choose a language: <a href="/en/">English</a> · <a href="/it/">Italiano</a> · <a href="/de/">Deutsch</a>.</p>
    <noscript><p>Automatic language detection requires JavaScript. Please choose one of the links above.</p></noscript>
  </main>
</body>
</html>
